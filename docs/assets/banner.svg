<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Office Vision Twin</title>
  <desc id="d">A live digital twin of a building: camera detections become people on a floor plan, fused with badge access into explainable security incidents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="1" stop-color="#0d1624"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#1f6feb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1b2636" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="400" fill="url(#glow)"/>

  <!-- floor plan -->
  <g transform="translate(700 70)" fill="none" stroke-width="2">
    <rect x="0" y="0" width="500" height="260" rx="4" stroke="#2c3e57"/>
    <path d="M0 110H330M330 0V260M170 110V260M330 150H500" stroke="#2c3e57"/>
    <rect x="332" y="2" width="166" height="146" fill="#da3633" fill-opacity="0.10" stroke="#da3633" stroke-opacity="0.7" stroke-dasharray="6 5"/>
    <text x="344" y="26" fill="#ff7b72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" stroke="none" letter-spacing="1">RESTRICTED · SERVER ROOM</text>
    <text x="14" y="26" fill="#58708f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" stroke="none" letter-spacing="1">CORRIDOR</text>
    <text x="14" y="136" fill="#58708f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" stroke="none" letter-spacing="1">RECEPTION</text>
    <text x="184" y="136" fill="#58708f" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" stroke="none" letter-spacing="1">OPEN WORK AREA</text>
    <!-- door -->
    <path d="M300 110h30" stroke="#d29922" stroke-width="5"/>
    <!-- track paths -->
    <path d="M40 70 C120 60 200 92 290 96 S 360 70 400 72" stroke="#3fb950" stroke-opacity="0.55" stroke-dasharray="3 6"/>
    <path d="M60 86 C140 84 220 104 300 100 S 380 98 430 104" stroke="#f85149" stroke-opacity="0.55" stroke-dasharray="3 6"/>
    <!-- people -->
    <circle cx="400" cy="72" r="16" fill="#3fb950" fill-opacity="0.25" stroke="none" filter="url(#soft)"/>
    <circle cx="400" cy="72" r="7" fill="#3fb950" stroke="#0d1624"/>
    <circle cx="430" cy="104" r="18" fill="#f85149" fill-opacity="0.35" stroke="none" filter="url(#soft)"/>
    <circle cx="430" cy="104" r="7" fill="#f85149" stroke="#0d1624"/>
    <circle cx="96" cy="190" r="6" fill="#79c0ff" stroke="#0d1624"/>
    <circle cx="232" cy="214" r="6" fill="#79c0ff" stroke="#0d1624"/>
    <circle cx="262" cy="176" r="6" fill="#79c0ff" stroke="#0d1624"/>
    <circle cx="420" cy="214" r="6" fill="#79c0ff" stroke="#0d1624"/>
    <!-- cameras -->
    <g fill="#8b949e" stroke="none">
      <path d="M6 6l14 4-4 6z"/><path d="M494 254l-14-4 4-6z"/><path d="M164 254l-14-4 4-6z"/>
    </g>
    <!-- incident card -->
    <g transform="translate(250 -46)">
      <rect width="250" height="40" rx="6" fill="#161b22" stroke="#f85149" stroke-opacity="0.8"/>
      <rect x="10" y="12" width="64" height="16" rx="3" fill="#f85149"/>
      <text x="42" y="24.5" text-anchor="middle" fill="#0d1117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" stroke="none">CRITICAL</text>
      <text x="84" y="25" fill="#e6edf3" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" stroke="none">Tailgating · 1 badge, 2 people</text>
    </g>
  </g>

  <!-- title -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="150" fill="#e6edf3" font-size="58" font-weight="700" letter-spacing="-1">Office Vision Twin</text>
    <text x="74" y="200" fill="#9fb3c8" font-size="23">Cameras see pixels. This understands the building.</text>
    <text x="74" y="262" fill="#6e8296" font-size="16">Live digital twin  ·  badge + video fusion  ·  evidence-grounded AI</text>
    <text x="74" y="290" fill="#6e8296" font-size="16">Runs on your premises  ·  no face recognition  ·  every alert explained</text>
  </g>
</svg>
