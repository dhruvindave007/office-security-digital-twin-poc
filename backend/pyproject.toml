[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "office-vision-backend"
version = "0.1.0"
description = "Office Vision Intelligence Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "shapely>=2.0.0",
    "pyyaml>=6.0.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "pytest-mock>=3.14.0",
]
vision = [
    "ultralytics==8.4.176",
    "openvino==2026.4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "backend/src"]
markers = [
    "vision_model: needs real YOLO weights and a real clip",
]
addopts = "-m 'not vision_model'"

